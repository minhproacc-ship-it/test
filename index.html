<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phát Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        .video-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="myVideo" autoplay muted loop playsinline controls>
            <source src="video.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ phát video.
        </video>
    </div>

    <script>
        const video = document.getElementById('myVideo');

        // Tự động phát video ngay khi trang tải xong
        window.addEventListener('load', () => {
            video.play().catch(err => {
                console.log('Tự động phát bị chặn, cần tương tác của người dùng:', err);
            });
        });

        // Thử phát lại khi người dùng tương tác (một số trình duyệt yêu cầu)
        document.addEventListener('click', () => {
            video.play().catch(() => {});
        });
    </script>
</body>
</html>
